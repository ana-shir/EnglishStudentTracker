async function createGroup(){const b=$('createGroupButton'),name=$('groupName').value.trim(),days=[...document.querySelectorAll('#scheduleDays input:checked')].map(x=>Number(x.value)),dateValue=$('groupFirstDate').value,error=$('groupError');error.textContent='';if(!name||!days.length||!dateValue){error.textContent='Заполните название, расписание и дату начала.';return}const first=localDate(dateValue),end=new Date(2026,11,31,12,0,0);if(first>end){error.textContent='Дата начала должна быть не позднее 31.12.2026.';return}if(!days.includes(first.getDay())){error.textContent='Дата начала должна соответствовать расписанию группы.';return}if(isLessonHoliday(first)){error.textContent='Дата начала не может приходиться на праздничный день.';return}const dates=generateLessonDates(first,days,end);b.disabled=true;try{const teacher=requireTeacher();await addDoc(collection(db,'groups'),{name,teacherId:teacher.uid,scheduleDays:days,firstLessonDate:Timestamp.fromDate(first),lessonDates:dates.map(Timestamp.fromDate),lessonCount:dates.length,createdAt:serverTimestamp()});closeModal($('groupModal'));showMessage(`Группа и календарь из ${dates.length} уроков созданы ✓`)}catch(e){console.error(e);error.textContent='Не удалось создать группу.'}finally{b.disabled=false}}
